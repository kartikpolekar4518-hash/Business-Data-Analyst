services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nops
      POSTGRES_PASSWORD: nops
      POSTGRES_DB: nops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Local demo only. The API refuses to boot on the public default secret
      # unless NODE_ENV is development/test — override both for any real deploy.
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nops:nops@db:5432/nops?schema=public
      # Demo default — export JWT_SECRET before `docker compose up` for anything non-local.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:5173
      PORT: 4000
      # Signals — the optional prediction service, spawned by the API as a child
      # process on loopback. Set ML_ENABLED=false to run without it: the Signals
      # pages then say so and nothing else in the product changes.
      ML_ENABLED: ${ML_ENABLED:-true}
      # Demo default, same convention as JWT_SECRET above. The service is bound to
      # 127.0.0.1 inside the container, so this is a second layer, not the boundary.
      ML_SHARED_SECRET: ${ML_SHARED_SECRET:-change-me-in-production}
      ML_SERVICE_URL: http://127.0.0.1:8000
      ML_TIMEOUT_MS: 120000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Runs migrations + seed on first boot, then serves API + web UI on :4000.
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"

volumes:
  pgdata:
