services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decisioniq
      POSTGRES_PASSWORD: decisioniq
      POSTGRES_DB: decisioniq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisioniq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://decisioniq:decisioniq@db:5432/decisioniq?schema=public
      # Demo default — export JWT_SECRET before `docker compose up` for anything non-local.
      # The API refuses to boot with this default when NODE_ENV=production.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:5173
      PORT: 4000
      # Demo seeding is ON by default for this local one-command demo. Set
      # SEED_DEMO=0 (and/or NODE_ENV=production) for any real deployment — the
      # seed also hard-refuses under NODE_ENV=production regardless.
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Migrations always run. The demo seed runs only when SEED_DEMO=1, then the
    # API + web UI serve on :4000. Production start is just migrate + server.
    command: sh -c "npx prisma migrate deploy && ([ \"$$SEED_DEMO\" = \"1\" ] && npx tsx prisma/seed.ts || echo '[seed] skipped (SEED_DEMO != 1)') && node dist/index.js"

volumes:
  pgdata:
