services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nops
      POSTGRES_PASSWORD: nops
      POSTGRES_DB: nops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://nops:nops@db:5432/nops?schema=public
      # Demo default — export JWT_SECRET before `docker compose up` for anything non-local.
      # The API refuses to boot with this default when NODE_ENV=production.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:5173
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Runs migrations + seed on first boot, then serves API + web UI on :4000.
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"

volumes:
  pgdata:
