# DecisionIQ — one-click free deploy to Render (https://render.com).
# In Render: New → Blueprint → connect this repo → Apply. Render reads this
# file, provisions the database, builds the Docker image, wires the secrets,
# and gives you a live https URL. See DEPLOY.md for the click-by-click guide.

databases:
  - name: decisioniq-db
    plan: free
    databaseName: decisioniq
    user: decisioniq

services:
  - type: web
    name: decisioniq
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Startup (migrate + seed + serve) is handled by apps/api/start.sh via the
    # Dockerfile CMD — keeping it there avoids shell-quoting issues here.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: decisioniq-db
          property: connectionString
      # Auto-generated strong secrets — you never see or set these by hand.
      - key: JWT_SECRET
        generateValue: true
      - key: CONNECTOR_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
