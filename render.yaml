# DecisionIQ — one-click free deploy to Render (https://render.com).
# In Render: New → Blueprint → connect this repo → Apply. Render reads this
# file, provisions the database, builds the Docker image, wires the secrets,
# and gives you a live https URL. See DEPLOY.md for the click-by-click guide.

databases:
  - name: decisioniq-db
    plan: free
    databaseName: decisioniq
    user: decisioniq

services:
  - type: web
    name: decisioniq
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Run DB migrations (required), seed demo data (best-effort — never blocks
    # startup), then start the server.
    dockerCommand: sh -c "npx prisma migrate deploy && { npx tsx prisma/seed.ts || echo 'seed skipped'; } && node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: decisioniq-db
          property: connectionString
      # Auto-generated strong secrets — you never see or set these by hand.
      - key: JWT_SECRET
        generateValue: true
      - key: CONNECTOR_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
