name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Secret scanning. GitHub's native secret scanning and CodeQL both require
  # Advanced Security on a private repo, so this uses gitleaks, which works
  # without GHAS. Scans full history; verified clean across the existing 122
  # commits (the demo creds in docker-compose/CI are not high-entropy secrets).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans commit history, not just the tip
      # Run the gitleaks binary directly rather than gitleaks-action: the action
      # calls the pull-request commits API (which needs pull-requests: read, and
      # 403s without it) and gates on an organisation licence. Neither is needed
      # to scan a checkout, so this drops both failure modes. Version pinned.
      - name: Scan commit history for secrets
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          # `gitleaks detect` exits 0 even when the git scan itself fails (e.g. no
          # .git), which would be a silent pass. Assert a real repo first so the
          # step fails loudly instead of falsely reporting "no leaks found".
          git rev-parse --is-inside-work-tree > /dev/null
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  build:
    runs-on: ubuntu-latest
    services:
      # Integration tests (apps/api *.itest.ts) run against a real Postgres.
      # Credentials match the DATABASE_URL hardcoded in the api test scripts.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      # Read only by the Prisma CLI, for the `migrate deploy` step below — never by the
      # API's queries. Same database here, because CI's Postgres has no pooler in front of
      # it. Set because schema.prisma declares `directUrl`: without it the migrate step
      # fails with "Environment variable not found: DIRECT_URL" and the job stops there.
      DIRECT_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The Signals prediction service. Separate toolchain, same job: it is one
      # deployed image, so a green build has to mean both halves pass.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt
      - run: npm ci
      # Supply-chain gate: fail the build on a known advisory of moderate severity or
      # worse. It sat at `high` and let three moderate qs advisories (a request-parsing
      # DoS reachable from any endpoint) ride along unnoticed, which is exactly the
      # class of thing this gate exists to catch.
      - run: npm audit --audit-level=moderate
      # Generate the Prisma client so @prisma/client resolves during typecheck + tests.
      - run: npm run prisma:generate --workspace apps/api
      - run: npm run typecheck
      - run: npm test
      # Apply the schema, then run the DB-backed integration tests.
      - run: npm run prisma:deploy --workspace apps/api
      - run: npm run test:integration --workspace apps/api
      - run: pip install -r apps/ml/requirements.txt
      - run: pytest apps/ml
